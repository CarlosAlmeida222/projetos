; ─── Configurações customizadas do PHP ──────────────────────────────────────

; Exibição de erros (ativo em desenvolvimento)
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Limites
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120
memory_limit = 256M

; Timezone
date.timezone = America/Sao_Paulo
