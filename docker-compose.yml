services:

  # ─── Serviço PHP + Apache ───────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"          # acesse via http://localhost:8080
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    networks:
      - projeto_net

  # ─── Serviço MySQL ──────────────────────────────────────────────────────────
  db:
    image: mysql:8.0.34
    restart: unless-stopped
    ports:
      - "3307:3306"        # acesse com MySQL Workbench em localhost:3307
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - projeto_net

  # ─── phpMyAdmin (opcional, mas muito útil) ──────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5.2.0
    restart: unless-stopped
    ports:
      - "8081:80"          # acesse via http://localhost:8081
    env_file:
      - .env
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASS}
    depends_on:
      - db
    networks:
      - projeto_net

volumes:
  db_data:

networks:
  projeto_net:
    driver: bridge
